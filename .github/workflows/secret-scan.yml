name: secret-scan

# Optional CI safety net: catch secrets before they land on a public memory
# library. See scripts/secret-scan.sh. Remove this file if you don't want CI.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/secret-scan.sh
      - run: ./scripts/secret-scan.sh