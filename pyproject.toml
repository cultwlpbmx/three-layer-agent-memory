[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "three-layer-agent-memory"
version = "0.8.4"
description = "A filesystem-native, version-controllable long-memory paradigm for AI agents. Surface/Middle/Deep layers + recall/writeback/consolidate protocol. Pure Markdown, zero infra, drives agent self-evolution."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "cultwlpbmx" }]
keywords = ["agent-memory", "ai-agent", "claude-code", "cognitive-architecture", "long-context", "memory", "self-improvement"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core has zero runtime dependencies — the paradigm's selling point.
# MCP server and snapshot are opt-in via extras.
dependencies = []

[project.optional-dependencies]
# MCP server (examples/mcp_server.py) — for cross-agent integration
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/cultwlpbmx/three-layer-agent-memory"

[tool.setuptools]
# Ship the templates inside the package so init() scaffolds for pip installs
# too (v0.8.4) — _template/ at repo root stays canonical for checkouts.
include-package-data = true

[tool.setuptools.package-data]
three_layer_memory = ["_template/**/*", "_template-en/**/*"]

[tool.setuptools.packages.find]
include = ["three_layer_memory*"]